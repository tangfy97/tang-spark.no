[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[redirects]]
  from = "/echoknot/api/ai/chat"
  to = "/.netlify/functions/echoknot-ai-chat"
  status = 200
  force = true

# kvikkshot-download (managed by Kvikkshot's scripts/publish-website.sh)
[[redirects]]
  from = "/kvikkshot/download"
  to = "/downloads/Kvikkshot-1.0.0.dmg"
  status = 302
  force = true
# end kvikkshot-download

# rydd-download (managed by Rydd's scripts/publish-website.sh)
[[redirects]]
  from = "/rydd/download"
  to = "/downloads/Rydd-1.0.0.dmg"
  status = 302
  force = true
# end rydd-download

# spolo-download (managed by Spolo's scripts/publish-website.sh)
[[redirects]]
  from = "/spolo/download"
  to = "/downloads/Spolo-1.0.0.dmg"
  status = 302
  force = true
# end spolo-download
