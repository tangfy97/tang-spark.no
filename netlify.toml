[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[redirects]]
  from = "/echoknot/api/ai/chat"
  to = "/.netlify/functions/echoknot-ai-chat"
  status = 200
  force = true

# kvikkshot-download: old download links go to the GitHub release; the site hosts no installers
[[redirects]]
  from = "/kvikkshot/download"
  to = "https://github.com/tangfy97/Kvikkshot/releases/latest"
  status = 302
  force = true
# end kvikkshot-download

# rydd-download: old download links go to the GitHub release; the site hosts no installers
[[redirects]]
  from = "/rydd/download"
  to = "https://github.com/tangfy97/Rydd/releases/latest"
  status = 302
  force = true
# end rydd-download

# spolo-download: old download links go to the GitHub release; the site hosts no installers
[[redirects]]
  from = "/spolo/download"
  to = "https://github.com/tangfy97/Spolo/releases/latest"
  status = 302
  force = true
# end spolo-download
